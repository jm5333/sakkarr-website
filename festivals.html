<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sakkar festival page</title>
<meta name="description" content="Celebrate every festival with family, from anywhere. Festival sweet hampers delivered across India.">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;family=Montserrat:wght@900&amp;family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFF6E9;color:#2A1218;font-family:'DM Sans',system-ui,sans-serif}
a{color:#7A1033}a:hover{color:#4A0A1F}
h1,h2,h3{font-family:'Baloo 2',system-ui,sans-serif;margin:0;line-height:1.02}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px;box-sizing:border-box}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 26px;border-radius:999px;font-weight:700;font-size:16px;text-decoration:none;letter-spacing:.02em;text-transform:uppercase}
.eyebrow{font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.tab{min-height:44px;padding:0 18px;border-radius:999px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">


<div style="width:100%;overflow:hidden">

<header style="background:#7A1033;color:#FFF6E9">
<div class="wrap" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding-top:16px;padding-bottom:16px">
<a href="index.html" aria-label="sakkarr home" style="display:flex;align-items:center;text-decoration:none">
<span style="display:inline-flex;background:#FFF8EA;border-radius:16px;padding:8px 14px"><img src="images/sakkarr-logo.png" alt="sakkarr" style="height:44px;width:auto;display:block"></span>
</a>
<nav aria-label="Main" style="display:flex;flex-wrap:wrap;gap:6px 24px;font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase">
<a href="#" style="color:#FFF6E9;text-decoration:none">Festivals</a>
<a href="index.html" style="color:#FFF6E9;text-decoration:none">Plans</a>
<a href="index.html" style="color:#FFF6E9;text-decoration:none">Shabaash gifts</a>
</nav>
<a class="btn" href="index.html" style="background:#F5A623;color:#2A1218;min-height:44px;font-size:14px">Start a plan</a>
</div>
</header>

<!-- festival switcher -->
<div style="background:#FFF6E9;border-bottom:1px solid #EBD9C6">
<div class="wrap" style="display:flex;gap:10px;overflow-x:auto;padding-top:16px;padding-bottom:16px" role="tablist" aria-label="Festivals">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="11">
<button class="tab" type="button" role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="min-height:44px;{{t.style}}">{{t.name}}</button>
</sc-for>
</div>
</div>

<!-- hero -->
<section style="background:{{f.bg}};color:{{f.fg}};padding:64px 0 120px;position:relative">
<div aria-hidden="true" style="position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;background:{{f.accent}};opacity:.22"></div>
<div aria-hidden="true" style="position:absolute;left:46%;bottom:90px;width:22px;height:22px;border-radius:50%;background:{{f.accent}}"></div>
<div aria-hidden="true" style="position:absolute;left:6%;top:40px;width:14px;height:14px;border-radius:50%;background:{{f.accent}}"></div>
<div class="wrap" style="display:flex;flex-wrap:wrap;gap:48px;align-items:center;position:relative">
<div style="flex:1 1 520px;min-width:0">
<p class="eyebrow" style="margin:0 0 16px">{{f.date}} · {{f.region}}</p>
<h1 style="font-size:clamp(52px,8vw,112px);font-weight:800;text-transform:uppercase;letter-spacing:-.01em">{{f.name}}</h1>
<p style="font-size:24px;line-height:1.4;margin:20px 0 0;max-width:560px">{{f.tagline}}</p>
<div style="display:flex;flex-wrap:wrap;gap:14px;margin-top:32px">
<a class="btn" href="index.html" style="background:{{f.fg}};color:{{f.bg}}">Add to a family's plan</a>
<a class="btn" href="index.html" style="border:2px solid {{f.fg}};color:{{f.fg}}">Send just once</a>
</div>
<p style="font-size:15px;margin:22px 0 0">Order by <b>{{f.orderBy}}</b> to arrive in time.</p>
</div>
<div style="flex:1 1 340px;min-width:0;display:flex;justify-content:center">
<div style="background:#FFF6E9;color:#2A1218;border-radius:32px;padding:30px;width:100%;max-width:400px;box-sizing:border-box;transform:rotate(-3deg);box-shadow:0 20px 44px rgba(0,0,0,.28)">
<div aria-hidden="true" style="height:150px;border-radius:20px;background:{{f.bg}};position:relative;overflow:hidden">
<div style="position:absolute;left:0;right:0;top:46%;height:16%;background:{{f.accent}}"></div>
<div style="position:absolute;left:46%;top:0;bottom:0;width:8%;background:{{f.accent}}"></div>
<div style="position:absolute;left:36%;top:30%;width:14%;height:26%;border-radius:50%;border:6px solid {{f.accent}};box-sizing:border-box"></div>
<div style="position:absolute;left:50%;top:30%;width:14%;height:26%;border-radius:50%;border:6px solid {{f.accent}};box-sizing:border-box"></div>
</div>
<div class="eyebrow" style="color:#7A1033;margin-top:20px;font-size:12px">Handpicked for the festival</div>
<h2 style="font-size:28px;margin-top:6px">Inside the hamper</h2>
<ul style="margin:12px 0 0;padding-left:20px;font-size:16px;line-height:1.7">
<sc-for list="{{f.sweets}}" as="s" hint-placeholder-count="3"><li>{{s.name}}</li></sc-for>
</ul>
<p style="margin:14px 0 0;font-size:14px;color:#5B3A42">Card signed in your name · photo proof on WhatsApp</p>
</div>
</div>
</div>
<div aria-hidden="true" style="position:absolute;left:0;right:0;bottom:-1px;height:60px;background:#FFF6E9;border-radius:60px 60px 0 0"></div>
</section>

<!-- sweets detail -->
<section style="padding:24px 0 88px">
<div class="wrap">
<p class="eyebrow" style="color:#C2410C;margin:0 0 12px">The mithai</p>
<h2 style="font-size:clamp(38px,5vw,60px);font-weight:800;text-transform:uppercase;color:#7A1033">Handpicked for this festival</h2>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-top:36px">
<sc-for list="{{f.sweets}}" as="s" hint-placeholder-count="3">
<article style="background:#FFFFFF;border:2px solid #EBD9C6;border-radius:28px;padding:28px">
<div aria-hidden="true" style="width:72px;height:72px;border-radius:50%;background:{{f.bg}};box-shadow:inset -8px -8px 0 rgba(0,0,0,.18)"></div>
<h3 style="font-size:28px;margin-top:18px">{{s.name}}</h3>
<p style="font-size:16px;line-height:1.5;color:#5B3A42;margin:8px 0 0">{{s.note}}</p>
</article>
</sc-for>
</div>
</div>
</section>

<!-- regional -->
<section style="background:{{f.bg}};color:{{f.fg}};padding:88px 0;border-radius:60px 60px 0 0">
<div class="wrap" style="display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start">
<div style="flex:1 1 380px;min-width:0">
<p class="eyebrow" style="margin:0 0 12px">Celebrated your family's way</p>
<h2 style="font-size:clamp(36px,4.5vw,56px);font-weight:800;text-transform:uppercase">One festival, many traditions</h2>
</div>
<div style="flex:1.3 1 440px;min-width:0">
<p style="font-size:20px;line-height:1.6;margin:0">{{f.regional}}</p>
<p style="font-size:16px;line-height:1.55;margin:20px 0 0;opacity:.9">Tell us your family's region and diet, and we match the sweets to the house they're going to, not just the festival.</p>
</div>
</div>
</section>

<!-- plans for this festival -->
<section style="background:#FFF6E9;padding:88px 0;border-radius:60px 60px 0 0;margin-top:-60px;position:relative">
<div class="wrap">
<p class="eyebrow" style="color:#C2410C;margin:0 0 12px">Two ways to send</p>
<h2 style="font-size:clamp(36px,4.5vw,56px);font-weight:800;text-transform:uppercase;color:#7A1033">Every year, or just this once</h2>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:36px">
<div style="background:#7A1033;color:#FFF6E9;border-radius:28px;padding:32px;display:flex;flex-direction:column;gap:14px">
<h3 style="font-size:32px">Add it to a plan</h3>
<p style="margin:0;font-size:16px;line-height:1.55;color:#FBE3D0">{{f.planNote}} We'll send it every year, without you having to remember.</p>
<a class="btn" href="index.html" style="margin-top:auto;background:#F5A623;color:#2A1218;align-self:flex-start">See plans</a>
</div>
<div style="background:#FFFFFF;border:2px solid #EBD9C6;border-radius:28px;padding:32px;display:flex;flex-direction:column;gap:14px">
<h3 style="font-size:32px;color:#7A1033">Send it once</h3>
<p style="margin:0;font-size:16px;line-height:1.55;color:#5B3A42">One hamper to one family, this festival only. No subscription.</p>
<a class="btn" href="index.html" style="margin-top:auto;border:2px solid #7A1033;color:#7A1033;align-self:flex-start">Send a hamper</a>
</div>
</div>
</div>
</section>

<footer style="background:#2A1218;color:#FBE3D0;padding:48px 0">
<div class="wrap" style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;font-size:14px">
<span style="display:inline-flex;background:#FFF8EA;border-radius:16px;padding:8px 14px"><img src="images/sakkarr-logo.png" alt="sakkarr" style="height:44px;width:auto;display:block"></span>
<span>Festival dates follow the panchang and moon sighting; we confirm each one before ordering.</span>
</div>
</footer>

</div>
</template>
<script src="js/runtime.js"></script>
<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 0 };
  }
  data() {
    return [
      { name: 'Diwali', date: 'Sun, Nov 8, 2026', region: 'All of India', bg: '#1B1F4B', fg: '#FFF6E9', accent: '#F5A623',
        tagline: 'Light up their home from yours.', orderBy: 'Nov 3', tier: 'Big festival · $11 a hamper',
        sweets: [ { name: 'Kaju katli', note: 'Silver-leaf cashew diamonds, the Diwali classic.' }, { name: 'Besan laddoo', note: 'Slow-roasted gram flour and ghee.' }, { name: 'Dry-fruit box', note: 'Almonds, cashews and raisins, for big-festival hampers.' } ],
        regional: 'In the north it is kaju katli and soan papdi; in Gujarat, mohanthal for the New Year; in the south, Mysore pak for Deepavali; in Bengal, sandesh for Kali Puja.',
        planNote: 'Included in every sakkarr plan, for every Ghar that celebrates it.' },
      { name: 'Bhai Dooj', date: 'Wed, Nov 11, 2026', region: 'All of India', bg: '#9A3412', fg: '#FFFFFF', accent: '#FDBA74',
        tagline: "A sister's blessing, delivered across the miles.", orderBy: 'Nov 6', tier: 'Family festival · $9–10 a hamper',
        sweets: [ { name: 'Kalakand', note: 'Soft milk cake, fresh the same morning.' }, { name: 'Coconut barfi', note: 'Light and not too sweet.' }, { name: 'Motichoor laddoo', note: 'The tika-day favourite.' } ],
        regional: 'Bhau Beej in Maharashtra, Bhai Phonta in Bengal, Bhai Tika in families near Nepal. You choose who sends to whom: sister to brother, or brother to sister.',
        planNote: 'Included in every sakkarr plan, for every Ghar that celebrates it.' },
      { name: 'Chhath Puja', date: 'Sun, Nov 15, 2026', region: 'Bihar, Jharkhand, eastern UP', bg: '#F59E0B', fg: '#2A1218', accent: '#7A1033',
        tagline: 'For the families who greet the setting sun together.', orderBy: 'Nov 10', tier: 'Regional festival · $9–10 a hamper',
        sweets: [ { name: 'Thekua', note: 'Wheat, jaggery and ghee, made the traditional way.' }, { name: 'Kasar laddoo', note: 'Rice flour and jaggery.' }, { name: 'Fruit basket', note: 'Banana, sugarcane and coconut.' } ],
        regional: 'Chhath prasad follows strict purity rules, and every hamper keeps them: no onion or garlic, packed with care.',
        planNote: 'Included in every sakkarr plan, for every Ghar that celebrates it.' },
      { name: 'Pongal · Lohri · Sankranti', date: 'Jan 14–15, 2027', region: 'Tamil Nadu, Punjab, Gujarat, Assam', bg: '#1F6B4F', fg: '#FFFFFF', accent: '#FACC15',
        tagline: 'One harvest, four names, the same warm wishes.', orderBy: 'Jan 9', tier: 'Family festival · $9–10 a hamper',
        sweets: [ { name: 'Til laddoo', note: 'Sesame and jaggery, for the Sankranti tradition.' }, { name: 'Gajak and chikki', note: 'Crunchy winter sweets for Lohri.' }, { name: 'Sakkarai pongal kit', note: 'Jaggery, rice and moong dal for the Pongal pot.' } ],
        regional: 'Lohri brings rewri and gajak; Sankranti, til-gud laddoo; Pongal, sakkarai pongal and murukku; Magh Bihu, pitha and laru. We send the one their home celebrates.',
        planNote: 'Included in every sakkarr plan, for every Ghar that celebrates it.' },
      { name: 'Eid-ul-Fitr', date: 'Wed, Mar 10, 2027 · moon sighting', region: 'All of India', bg: '#065F46', fg: '#FFFFFF', accent: '#FDE68A',
        tagline: 'Eid Mubarak, with seviyan from the family abroad.', orderBy: 'Mar 5', tier: 'Big festival · $11 a hamper',
        sweets: [ { name: 'Sheer khurma kit', note: 'Vermicelli, dates and dry fruits.' }, { name: 'Seviyan', note: 'Roasted, ready for the Eid morning pot.' }, { name: 'Dates and dry fruits', note: 'A generous festive tray.' } ],
        regional: 'Hyderabad loves double ka meetha and qubani ka meetha; Lucknow and Delhi, sheer khurma; Kerala, Malabar sweets.',
        planNote: 'Included in every sakkarr plan, for every Ghar that celebrates it.' },
      { name: 'Holi', date: 'Mon, Mar 22, 2027', region: 'All of India', bg: '#BE185D', fg: '#FFFFFF', accent: '#FDE047',
        tagline: 'Colour their day, even from another time zone.', orderBy: 'Mar 17', tier: 'Big festival · $11 a hamper',
        sweets: [ { name: 'Gujiya', note: 'Crisp pastry filled with khoya and nuts.' }, { name: 'Besan barfi', note: 'Rich and festive.' }, { name: 'Thandai mix', note: 'Almond, fennel and rose, just add milk.' } ],
        regional: 'In Braj it is gujiya and thandai; in Bengal, Dol Jatra sandesh; in Maharashtra, puran poli for Rang Panchami.',
        planNote: 'Included in every sakkarr plan, for every Ghar that celebrates it.' },
      { name: 'Ugadi · Gudi Padwa', date: 'Wed, Apr 7, 2027', region: 'Telugu states, Karnataka, Maharashtra', bg: '#A16207', fg: '#FFFFFF', accent: '#FEF3C7',
        tagline: 'A sweet start to their new year.', orderBy: 'Apr 2', tier: 'Regional festival · $9–10 a hamper',
        sweets: [ { name: 'Obbattu / puran poli', note: 'Sweet lentil flatbread, a festive favourite.' }, { name: 'Shrikhand', note: 'Saffron hung curd, for Gudi Padwa.' }, { name: 'Bevu-bella pack', note: 'Neem and jaggery, the bittersweet start.' } ],
        regional: 'Karnataka and Andhra share obbattu and bevu-bella; Maharashtra, puran poli and shrikhand; Telangana, an Ugadi pachadi kit.',
        planNote: 'Included in every sakkarr plan, for every Ghar that celebrates it.' },
      { name: 'Raksha Bandhan', date: 'Tue, Aug 17, 2027', region: 'North and West India, and beyond', bg: '#9F1239', fg: '#FFFFFF', accent: '#FBCFE8',
        tagline: "When you can't tie the rakhi in person, send the sweetness.", orderBy: 'Aug 12', tier: 'Big festival · $11 a hamper',
        sweets: [ { name: 'Ghewar', note: 'Rajasthan’s monsoon festival sweet.' }, { name: 'Kaju roll', note: 'Cashew and pista swirl.' }, { name: 'Rakhi set', note: 'Rakhi, roli and chawal, ready for the thali.' } ],
        regional: 'Rajasthan and Delhi want ghewar; Gujarat, mohanthal; Bengal, sandesh with the rakhi.',
        planNote: 'Included in every sakkarr plan, for every Ghar that celebrates it.' },
      { name: 'Vinayaka Chavithi', date: 'Sat, Sep 4, 2027', region: 'Maharashtra, Telugu states, Karnataka, Goa', bg: '#C2410C', fg: '#FFFFFF', accent: '#FED7AA',
        tagline: "Bappa's favourite, at their doorstep.", orderBy: 'Aug 30', tier: 'Big festival · $11 a hamper',
        sweets: [ { name: 'Ukadiche modak', note: 'Steamed rice dumplings with coconut and jaggery.' }, { name: 'Kozhukattai / undrallu', note: 'The South Indian favourite.' }, { name: 'Motichoor laddoo', note: 'For the puja thali.' } ],
        regional: 'Maharashtra makes ukadiche modak; Tamil Nadu, kozhukattai; Andhra and Telangana, undrallu; Karnataka, kadubu.',
        planNote: 'Included in every sakkarr plan, for every Ghar that celebrates it.' },
      { name: 'Durga Puja', date: 'Oct 6–10, 2027', region: 'West Bengal, Odisha, Assam', bg: '#B91C1C', fg: '#FFFFFF', accent: '#FDE68A',
        tagline: 'Pujo greetings with real Kolkata mishti.', orderBy: 'Oct 1', tier: 'Regional festival · $9–10 a hamper',
        sweets: [ { name: 'Rosogolla', note: 'Soft, spongy and syrupy.' }, { name: 'Sandesh', note: 'Nolen gur when in season.' }, { name: 'Vrat laddoo', note: 'Fasting-friendly, for Navratri homes.' } ],
        regional: 'Bengal celebrates with rosogolla and sandesh; Gujarat with sweets after Garba nights; the north with vrat-friendly sweets for the nine days.',
        planNote: 'Included in every sakkarr plan, for every Ghar that celebrates it.' },
      { name: 'Onam', date: 'Aug–Sep 2027 · date to confirm', region: 'Kerala', bg: '#FACC15', fg: '#2A1218', accent: '#1F6B4F',
        tagline: 'Sadya sweetness for the family back in Kerala.', orderBy: '5 days before', tier: 'Regional festival · $9–10 a hamper',
        sweets: [ { name: 'Payasam kit', note: 'Ada pradhaman, ready for the sadya.' }, { name: 'Banana chips and sharkara varatti', note: 'Fried in coconut oil, the Kerala way.' }, { name: 'Unniyappam', note: 'Small rice, banana and jaggery fritters.' } ],
        regional: 'Every Onam hamper carries Kerala’s own festive flavours, so the payasam tastes like home.',
        planNote: 'Included in every sakkarr plan, for every Ghar that celebrates it.' }
    ];
  }
  renderVals() {
    const list = this.data();
    const picked = this.state.picked;
    const f = list[picked];
    const tabs = list.map((x, i) => ({
      name: x.name,
      selected: i === picked ? 'true' : 'false',
      style: i === picked
        ? 'background:' + x.bg + ';color:' + x.fg + ';border:2px solid ' + x.bg
        : 'background:#FFFFFF;color:#2A1218;border:2px solid #EBD9C6',
      pick: () => this.setState({ picked: i })
    }));
    return { f, tabs };
  }
}

DC.mount(Component);
</script>
</body>
</html>
