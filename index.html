<script>

class Component extends DCLogic {
  renderVals() {
    const week = ['S','M','T','W','T','F','S'].map((d) => ({ d }));
    const base = 'height:26px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:12px;';
    const mk = (name, monthLabel, dateLabel, start, days, hl, bg, fg) => {
      const cells = [];
      for (let i = 0; i < start; i++) cells.push({ label: '', style: base });
      for (let d = 1; d <= days; d++) {
        const on = hl.indexOf(d) !== -1;
        cells.push({ label: String(d), style: base + (on ? 'background:' + fg + ';color:' + bg + ';font-weight:800;' : 'opacity:.35;') });
      }
      return { name, monthLabel, dateLabel, bg, fg, week, cells };
    };
    return {
      festivals: [
        mk('Diwali', 'Nov 2026', 'Sun, Nov 8', 0, 30, [8], '#1B1F4B', '#FFF6E9'),
        mk('Bhai Dooj', 'Nov 2026', 'Wed, Nov 11', 0, 30, [11], '#9A3412', '#FFFFFF'),
        mk('Chhath Puja', 'Nov 2026', 'Sun, Nov 15', 0, 30, [15], '#F59E0B', '#2A1218'),
        mk('Pongal · Lohri', 'Jan 2027', 'Jan 14–15', 5, 31, [14, 15], '#1F6B4F', '#FFFFFF'),
        mk('Eid-ul-Fitr', 'Mar 2027', 'Mar 10 · moon sighting', 1, 31, [10], '#065F46', '#FFFFFF'),
        mk('Holi', 'Mar 2027', 'Mar 21–22', 1, 31, [21, 22], '#BE185D', '#FFFFFF'),
        mk('Raksha Bandhan', 'Aug 2027', 'Tue, Aug 17', 0, 31, [17], '#9F1239', '#FFFFFF'),
        mk('Vinayaka Chavithi', 'Sep 2027', 'Sat, Sep 4', 3, 30, [4], '#C2410C', '#FFFFFF')
      ]
    };
  }
}

DC.mount(Component);
</script>
